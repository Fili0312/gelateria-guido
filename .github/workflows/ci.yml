name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_MOCK: '1'
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/gelateria_ci?schema=public
      NEXT_BASE_PATH: /gelateria
      NEXT_TELEMETRY_DISABLED: '1'
      STORAGE_DIR: /tmp/gelateria-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Dipendenze
        run: pnpm install --frozen-lockfile

      - name: Client Prisma
        run: pnpm exec prisma generate

      - name: Formattazione
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipi
        run: pnpm typecheck

      - name: Test portabili
        run: pnpm test

      - name: Build
        run: pnpm build
